<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="PanditSuggest Logo">
  <defs>
    <linearGradient id="gradP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" /> <!-- gold/orange top -->
      <stop offset="35%" stop-color="#ea580c" /> <!-- rich orange middle -->
      <stop offset="100%" stop-color="#450a0a" /> <!-- dark brown bottom -->
    </linearGradient>
  </defs>

  <g transform="translate(10, 20)">
    <!-- Main 'P' Stem and Curve -->
    <path d="M 20 110 C 20 110 25 105 25 90 L 25 35 C 25 35 25 25 35 25 L 55 25 C 85 25 105 35 105 65 C 105 90 85 100 55 100 L 45 100 C 45 100 40 100 35 110 Z" fill="url(#gradP)"/>
    
    <!-- Hole in 'P' -->
    <path d="M 45 42 L 55 42 C 70 42 80 50 80 65 C 80 80 70 85 55 85 L 45 85 Z" fill="#ffffff" />
    
    <!-- Temple Domes on Top -->
    <!-- Center Dome -->
    <path d="M 45 25 C 45 5 52 5 55 -5 C 58 5 65 5 65 25 Z" fill="url(#gradP)"/>
    <!-- Left Dome -->
    <path d="M 32 25 C 32 12 36 12 38 6 C 40 12 44 12 44 25 Z" fill="url(#gradP)"/>
    <!-- Right Dome -->
    <path d="M 66 25 C 66 12 70 12 72 6 C 74 12 78 12 78 25 Z" fill="url(#gradP)"/>
    <!-- Flags/spires -->
    <rect x="54" y="-20" width="2" height="15" fill="url(#gradP)"/>
    <path d="M 56 -18 L 66 -13 L 56 -8 Z" fill="url(#gradP)"/> <!-- Flag -->
    <circle cx="38" cy="4" r="2" fill="url(#gradP)"/>
    <circle cx="72" cy="4" r="2" fill="url(#gradP)"/>

    <!-- Hanging Bell inside the P hole -->
    <rect x="70" y="42" width="2" height="16" fill="url(#gradP)"/>
    <path d="M 65 58 C 65 52 77 52 77 58 Z" fill="url(#gradP)"/>
    <circle cx="71" cy="59" r="2" fill="url(#gradP)"/>
    <rect x="64" y="58" width="14" height="2" fill="url(#gradP)"/>

    <!-- Hand (Namaste) sweeping up from the stem -->
    <path d="M 25 80 C 40 75 48 65 52 50 C 50 48 46 50 46 55 C 42 65 35 72 25 75 Z" fill="#ffffff"/>
    <path d="M 25 90 C 40 85 50 70 54 50 C 56 46 60 45 56 58 C 50 75 40 85 25 95 Z" fill="#ffffff"/>
    <path d="M 25 100 C 45 95 55 75 60 55 C 63 50 67 48 62 65 C 55 85 45 95 25 105 Z" fill="#ffffff"/>
  </g>
</svg>
