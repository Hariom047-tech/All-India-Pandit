<!DOCTYPE html>
<!-- Screenshot harness: Chrome's window has a ~500px minimum on Windows, so a
     narrow --window-size never produces a true phone layout viewport. An iframe
     gets its own viewport, which does. Open with any ?p=<page> query. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile preview</title>
<style>
  body { margin: 0; background: #4a4a4a; display: flex; gap: 24px; padding: 20px; font: 13px system-ui; }
  figure { margin: 0; }
  figcaption { color: #fff; padding-bottom: 8px; font-weight: 600; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<script>
  var pages = (new URLSearchParams(location.search).get('p') || 'index.html').split(',');
  var w = +(new URLSearchParams(location.search).get('w') || 390);
  var h = +(new URLSearchParams(location.search).get('h') || 1500);
  document.write(pages.map(function (p) {
    return '<figure><figcaption>' + p + ' @ ' + w + 'px</figcaption>' +
      '<iframe src="../' + p + '" width="' + w + '" height="' + h + '"></iframe></figure>';
  }).join(''));
</script>
</body>
</html>
