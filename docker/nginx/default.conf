# Serves the static frontend and reverse-proxies /api/ to the backend
# container, so the browser only ever talks to one origin — no CORS needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cache-bust friendly: long cache for hashed/static assets, none for HTML
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # React Router SPA: any route that isn't a real static file falls back to
    # index.html so client-side routing can take over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
