# HTTP (plain, no redirect) + HTTPS, one block.
#
# panditsuggest.com/www now sit behind a CloudFront distribution, which
# connects to this origin over port 80 only, no TLS. A `return 301
# https://...` here (the old behavior) made CloudFront's own origin fetch
# get redirected right back at itself, forever — ERR_TOO_MANY_REDIRECTS.
# CloudFront's own viewer-protocol policy already forces real visitors onto
# HTTPS at the edge, so nginx doesn't need to redirect anyone itself.
server {
    listen 80;
    listen 443 ssl http2;
    server_name panditsuggest.com www.panditsuggest.com;

    # Let's Encrypt ACME challenge (needed for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SSL certificates (mounted from host via docker volume)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL config (Mozilla recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Text compression was entirely off (stock nginx ships gzip disabled) —
    # every response, including the ~261KB JS entry bundle, was going out
    # over the wire uncompressed. text/html is gzipped by nginx unconditionally
    # and isn't listed below (nginx quirk, not an omission).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Hashed assets (Vite content-hashes the filename, so a given filename's
    # content can never change) get a 1-year cache — everything else must
    # revalidate so a rebuild is picked up without a hard refresh.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }



    # ── Admin panel hardening ───────────────────────────────────────
    #
    # `noindex` keeps the admin URL out of search results. Appearing in Google
    # is how private surfaces are usually discovered — far more often than by
    # someone guessing paths.
    #
    # THE REAL CONTROL IS THE COMMENTED ALLOW-LIST BELOW. Uncomment it and put
    # your office / home / VPN addresses in, and the admin panel stops being
    # reachable from the internet at all. Everything else here — the secret API
    # path, noindex, the honeypot — only slows down or detects an attacker.
    # An IP allow-list stops one.
    location ^~ /admin-panel {
        # allow 203.0.113.7;      # <- your static IP
        # allow 10.0.0.0/8;       # <- office / VPN range
        # deny  all;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # Source maps publish readable source. They should not exist in a
    # production build (vite.config.ts sets sourcemap:false) — this is the
    # belt to that braces, in case one is ever produced by accident.
    location ~* \.map$ { return 404; }

    # Dotfiles: .env, .git, editor swap files. Never serveable.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Uploaded pandit media, served by the backend from backend/public/uploads.
    #
    # `^~` is load-bearing: without it the regex location above
    # (\.(css|js|svg|png|jpe?g|webp|ico)$) wins for an uploaded .jpg — nginx
    # gives regex locations precedence over plain prefix locations — and the
    # file 404s from the SPA root instead of ever reaching the backend.
    location ^~ /uploads/ {
        # Uploaded media should never be indexed — it is user content, and a
        # pandit's photo turning up in image search is not something they agreed to.
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Videos need byte-range requests to be seekable. Buffering the whole
        # response would break scrubbing and delay first frame.
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Filenames are random hex and never rewritten, so they can be
        # cached hard.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Reverse proxy to backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic sitemap (backend/src/controllers/sitemap.controller.js) — served
    # at the conventional root path robots.txt's `Sitemap:` line already
    # points at, not under /api. Exact-match `location =` so it wins over the
    # SPA catch-all without needing to be reordered against it.
    location = /sitemap.xml {
        proxy_pass http://backend:4000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-injected SEO metadata (backend/src/controllers/render.controller.js,
    # docs/SEO_ARCHITECTURE.md Phase 7) — a non-JS crawler or link-preview bot
    # hitting the homepage or an entity detail page gets the real title/
    # description/OG/JSON-LD baked into the SPA shell before any JS runs. A
    # real browser gets the identical shell and mounts React exactly as before.
    #
    # `error_page ... = @spa_fallback` is the real safety net: if the backend
    # is unreachable or errors, nginx serves the plain static SPA shell
    # directly instead of showing a visitor a broken page. The backend has
    # its own internal fallback too (serves the unmodified shell on any
    # failure short of "can't reach the frontend at all") — this is the
    # outer layer for that last case.
    location = / {
        proxy_pass http://backend:4000/api/_render/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location ~ ^/(temples|services|pandits)/[^/]+$ {
        proxy_pass http://backend:4000/api/_render$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location @spa_fallback {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Raw SPA shell, fetched by the backend (indexHtmlCache.js) over the
    # internal Docker network to build the responses above. MUST be a
    # separate path from "/" — the backend fetching "/" itself would hit
    # the `location = /` proxy above and bounce back to the backend in an
    # infinite loop. Same content anyone can already get at "/"; the
    # noindex header just keeps it out of search results since nothing
    # links to it.
    location = /__spa-shell__ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
