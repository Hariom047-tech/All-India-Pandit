# LOCAL / development server block — plain HTTP on port 80 inside the container.
#
# The production default.conf is hardcoded for panditsuggest.com: it 301s all
# HTTP to HTTPS and reads Let's Encrypt certificates from /etc/nginx/ssl.
# Neither exists on a developer machine, so `docker compose up` with that file
# either fails to start (missing cert mount) or redirects localhost into a
# TLS error. This file is mounted over it by docker-compose.override.yml.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Text compression was entirely off (stock nginx ships gzip disabled) —
    # every response, including the ~261KB JS entry bundle, was going out
    # over the wire uncompressed. text/html is gzipped by nginx unconditionally
    # and isn't listed below (nginx quirk, not an omission).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Hashed assets (Vite content-hashes the filename, so a given filename's
    # content can never change) get a 1-year cache — everything else must
    # revalidate so a rebuild is picked up without a hard refresh.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router SPA fallback — this is what makes /pandit/dashboard,
    # /pandit-login and /admin-panel resolve on a full page load rather than 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }



    # ── Admin panel hardening ───────────────────────────────────────
    #
    # `noindex` keeps the admin URL out of search results. Appearing in Google
    # is how private surfaces are usually discovered — far more often than by
    # someone guessing paths.
    #
    # THE REAL CONTROL IS THE COMMENTED ALLOW-LIST BELOW. Uncomment it and put
    # your office / home / VPN addresses in, and the admin panel stops being
    # reachable from the internet at all. Everything else here — the secret API
    # path, noindex, the honeypot — only slows down or detects an attacker.
    # An IP allow-list stops one.
    location ^~ /admin-panel {
        # allow 203.0.113.7;      # <- your static IP
        # allow 10.0.0.0/8;       # <- office / VPN range
        # deny  all;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # Source maps publish readable source. They should not exist in a
    # production build (vite.config.ts sets sourcemap:false) — this is the
    # belt to that braces, in case one is ever produced by accident.
    location ~* \.map$ { return 404; }

    # Dotfiles: .env, .git, editor swap files. Never serveable.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Uploaded pandit media, served by the backend from backend/public/uploads.
    #
    # `^~` is load-bearing: without it the regex location above
    # (\.(css|js|svg|png|jpe?g|webp|ico)$) wins for an uploaded .jpg — nginx
    # gives regex locations precedence over plain prefix locations — and the
    # file 404s from the SPA root instead of ever reaching the backend.
    location ^~ /uploads/ {
        # Uploaded media should never be indexed — it is user content, and a
        # pandit's photo turning up in image search is not something they agreed to.
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Videos need byte-range requests to be seekable. Buffering the whole
        # response would break scrubbing and delay first frame.
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Filenames are random hex and never rewritten, so they can be
        # cached hard.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic sitemap (backend/src/controllers/sitemap.controller.js) — served
    # at the conventional root path robots.txt's `Sitemap:` line already
    # points at, not under /api. Exact-match `location =` so it wins over the
    # SPA catch-all without needing to be reordered against it.
    location = /sitemap.xml {
        proxy_pass http://backend:4000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-injected SEO metadata (backend/src/controllers/render.controller.js,
    # docs/SEO_ARCHITECTURE.md Phase 7) — see default.conf for the full
    # explanation, kept identical here.
    location = / {
        proxy_pass http://backend:4000/api/_render/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location ~ ^/(temples|services|pandits)/[^/]+$ {
        proxy_pass http://backend:4000/api/_render$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location @spa_fallback {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Raw SPA shell, fetched by the backend (indexHtmlCache.js) over the
    # internal Docker network — see default.conf for why this can't be "/".
    location = /__spa-shell__ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
